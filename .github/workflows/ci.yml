name: CI

on:
  push:
  pull_request:
  schedule:
    # 07:30 UTC is 02:30 America/New_York during standard time.
    # (GitHub cron does not support time zones/DST directly.)
    - cron: '30 7 * * *'
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean-room guard
        run: ./scripts/cleanroom_guard.sh

  aur-validate:
    runs-on: ubuntu-latest
    needs: guard
    container: archlinux:base
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging validation toolchain
        run: |
          pacman -Sy --noconfirm --needed base-devel git jq
      - name: Validate release metadata rendering
        run: |
          set -euo pipefail
          test -f packaging/scripts/render_release_metadata.sh
          test -f packaging/aur/openbitdo-bin/PKGBUILD.tmpl
          test -f packaging/homebrew/Formula/openbitdo.rb.tmpl
          test ! -f packaging/homebrew/Formula/openbitdo.rb
          bash packaging/scripts/test_render_release_metadata.sh
      - name: Validate Homebrew tap sync helper
        run: |
          set -euo pipefail
          bash packaging/homebrew/test_sync_tap.sh
      - name: Validate PKGBUILD and .SRCINFO
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -s /bin/bash -c "set -euo pipefail; \
            cd '$GITHUB_WORKSPACE/packaging/aur/openbitdo-bin'; \
            makepkg --printsrcinfo > /tmp/openbitdo-bin.srcinfo; \
            diff -u .SRCINFO /tmp/openbitdo-bin.srcinfo"
      - name: Check docs consistency
        run: |
          set -euo pipefail
          bash scripts/check_docs_consistency.sh

  tui-smoke-test:
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config build-essential
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run TUI package tests (includes teatest end-to-end scenarios)
        run: go test ./internal/tui/... -v

  build-macos-arm64:
    runs-on: macos-14
    needs: guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build/package macOS arm64 artifacts
        run: ./scripts/package-macos.sh v0.0.0-ci arm64
      - name: Upload macOS arm64 artifact sample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-macos-arm64-package
          path: dist/openbitdo-v0.0.0-ci-macos-arm64*

  build-linux-x86_64:
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config build-essential
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build/package linux x86_64 artifacts
        run: ./scripts/package-linux.sh v0.0.0-ci x86_64
      - name: Upload linux x86_64 artifact sample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-linux-x86_64-package
          path: dist/openbitdo-v0.0.0-ci-linux-x86_64*

  build-linux-aarch64:
    runs-on: ubuntu-24.04-arm
    needs: guard
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config build-essential
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build/package linux aarch64 artifacts
        run: ./scripts/package-linux.sh v0.0.0-ci aarch64
      - name: Upload linux aarch64 artifact sample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-linux-aarch64-package
          path: dist/openbitdo-v0.0.0-ci-linux-aarch64*

  test:
    runs-on: ubuntu-latest
    needs:
      - guard
      - tui-smoke-test
      - aur-validate
      - build-macos-arm64
      - build-linux-x86_64
      - build-linux-aarch64
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config build-essential
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lint (strict)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
      - name: Vet
        run: go vet ./...
      - name: Run tests (race detector)
        run: go test -race ./...
